<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptStore | Aether Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-base: #f0f7f4;
            --blob-1: #a7f3d0;
            --blob-2: #fde68a;
            --blob-3: #99f6e4;
            --panel-bg: rgba(255, 255, 255, 0.45);
            --panel-border: rgba(255, 255, 255, 0.7);
            --panel-shadow: rgba(0, 50, 20, 0.1);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --accent-text: #ffffff;
        }

        body[data-mode="nsfw"] {
            --bg-base: #0f172a;
            --blob-1: #8b5cf6;
            --blob-2: #3b82f6;
            --blob-3: #ec4899;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            --panel-shadow: rgba(0, 0, 0, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --accent-text: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, .cinematic-text { font-family: 'Cinzel', serif; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 40px var(--panel-shadow);
            border-radius: 2rem;
        }

        .nav-pill {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-pill.active {
            color: var(--accent-text);
            background: var(--accent);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        textarea, select, input {
            background: var(--panel-bg) !important;
            border: 2px solid var(--panel-border) !important;
            color: var(--text-main) !important;
            border-radius: 1rem !important;
            transition: all 0.3s ease !important;
        }

        .btn-magic {
            background: var(--accent);
            color: var(--accent-text);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 1.25rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .btn-magic:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 15px 35px var(--accent-glow);
            transform: translateY(-4px) scale(1.02);
        }

        .bottom-console {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1100px;
            z-index: 50;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .bottom-console.minimized { transform: translate(-50%, calc(100% - 3.5rem)); opacity: 0.9; }

        main {
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-top: 8rem;
            padding-bottom: 20rem;
        }

        .bubble-container { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 5rem; padding: 2rem; }
        .bubble { width: 240px; height: 240px; border-radius: 50%; position: relative; cursor: pointer; animation: bubbleFloat 4s ease-in-out infinite alternate; }
        @keyframes bubbleFloat { from { transform: translateY(0px); } to { transform: translateY(-20px); } }

        .bubble-img-overlay { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; opacity: 1; z-index: 1; }
        .bubble-img-overlay img { width: 100%; height: 100%; object-fit: cover; }
        .bubble-sphere { width: 100%; height: 100%; border-radius: 50%; position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4) 0%, transparent 60%); box-shadow: inset -10px -10px 30px rgba(0,0,0,0.1), 0 10px 30px var(--accent-glow); }

        .loader { width: 20px; height: 20px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ambient-bg { position: fixed; inset: -20%; z-index: -1; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: float 25s infinite ease-in-out alternate; }
        .blob-1 { top: 10%; left: 10%; width: 45vw; height: 45vw; background: var(--blob-1); }
        .blob-2 { bottom: 10%; right: 10%; width: 55vw; height: 55vw; background: var(--blob-2); }
        main::-webkit-scrollbar { width: 0px; background: transparent; }

        .art-frame { border-radius: 1.5rem; overflow: hidden; position: relative; transition: all 0.5s ease; border: 4px solid var(--panel-bg); background: var(--panel-bg); cursor: pointer; }
        .art-frame:hover { transform: translateY(-8px); border-color: var(--accent); }
    </style>
</head>

<body data-mode="standard">
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Header -->
    <header class="fixed top-6 left-0 right-0 z-[100] px-8">
        <div class="max-w-7xl mx-auto glass-panel p-4 border-t-4 border-t-[var(--accent)] flex items-center justify-between shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-[var(--accent)] text-white flex items-center justify-center shadow-lg transform -rotate-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></svg>
                </div>
                <h1 class="text-xl font-black cinematic-text tracking-widest hidden sm:block">AETHER</h1>
            </div>
            <nav class="flex items-center gap-2 bg-black/5 p-1 rounded-2xl mx-auto">
                <button data-view="generate" class="nav-pill active px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Forge</button>
                <button data-view="tasks" class="nav-pill px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Queue</button>
                <button data-view="history" class="nav-pill px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Vault</button>
            </nav>
            <div class="w-10 h-10 sm:hidden"></div>
        </div>
    </header>

    <!-- Detail Modal -->
    <div id="modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-2xl opacity-0 transition-opacity duration-500">
        <div class="glass-panel max-w-6xl w-full max-h-[90vh] flex flex-col lg:flex-row overflow-hidden shadow-2xl scale-95 transition-transform duration-500" id="modalContainer">
            <div class="flex-1 bg-black/10 flex items-center justify-center p-6">
                <img id="modalImage" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl" />
            </div>
            <div class="w-full lg:w-[400px] p-8 flex flex-col gap-6 bg-white/5 overflow-y-auto border-t lg:border-l border-white/10">
                <h3 class="text-3xl font-bold cinematic-text">Manifestation</h3>
                <div class="space-y-4">
                    <div class="p-4 bg-[var(--panel-bg)] rounded-xl border border-[var(--panel-border)]">
                        <p class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] mb-1 font-bold">The Vision</p>
                        <p id="modalPrompt" class="text-sm font-medium italic leading-relaxed"></p>
                    </div>
                </div>
                <div class="mt-auto space-y-4 pb-8 lg:pb-0">
                    <a id="downloadImageBtn" href="#" download class="block w-full py-4 btn-magic font-bold text-center uppercase tracking-widest shadow-xl">Save Image</a>
                    <button onclick="closeModal()" class="w-full py-3 text-[var(--text-muted)] font-bold uppercase tracking-widest text-xs hover:text-[var(--text-main)] transition-colors">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Area -->
    <main id="mainContent">
        <section id="view-generate" class="view">
            <div id="gallery" class="bubble-container">
                <div id="galleryEmpty" class="py-32 text-center opacity-10 text-3xl font-light cinematic-text tracking-[0.3em] uppercase">Void Awaiting Light</div>
            </div>
        </section>

        <section id="view-tasks" class="view hidden px-8">
            <div class="max-w-7xl mx-auto glass-panel p-10 min-h-[400px]">
                <h2 class="text-4xl font-bold cinematic-text mb-8">Active Journeys</h2>
                <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </section>

        <section id="view-history" class="view hidden px-8">
            <div class="max-w-7xl mx-auto glass-panel p-10 min-h-[400px]">
                <h2 class="text-4xl font-bold cinematic-text mb-8">The Vault</h2>
                <div id="historyList" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
            </div>
        </section>
    </main>

    <!-- COMPACT 2-COLUMN CONSOLE -->
    <div id="desktopConsole" class="bottom-console glass-panel p-4 border-2 border-[var(--accent)]">
        <button onclick="toggleConsole()" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-[var(--accent)] text-white px-6 py-2 rounded-t-xl font-bold text-[10px] uppercase tracking-widest shadow-lg">
            <span id="consoleToggleText">Minimize</span>
        </button>

        <div class="grid grid-cols-12 gap-4 items-stretch">
            <!-- Left: Config (4 cols) -->
            <div class="col-span-12 lg:col-span-4 flex flex-col gap-3">
                <div class="flex items-center gap-1 bg-black/5 p-1 rounded-xl h-9 shrink-0">
                    <button data-mode="standard" class="nav-pill active w-1/2 h-full rounded-lg text-[9px] font-bold uppercase">Day</button>
                    <button data-mode="nsfw" class="nav-pill w-1/2 h-full rounded-lg text-[9px] font-bold uppercase">Star</button>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Engine</label>
                    <select id="model" class="w-full h-9 px-3 font-bold text-xs"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Fidelity</label>
                        <select id="quality" class="w-full h-9 px-3 font-bold text-xs"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Canvas</label>
                        <select id="aspect" class="w-full h-9 px-3 font-bold text-xs"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Spirits</label>
                        <select id="count" class="w-full h-9 px-3 font-bold text-xs">
                            <option value="1">1 Spirit</option>
                            <option value="2">2 Spirits</option>
                            <option value="3">3 Spirits</option>
                            <option value="4" selected>4 Spirits</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Seed</label>
                        <input id="seed" type="number" placeholder="Random" class="w-full h-9 px-3 font-bold text-xs">
                    </div>
                </div>
            </div>

            <!-- Right: Vision (8 cols) -->
            <div class="col-span-12 lg:col-span-8 flex flex-col gap-3">
                <div class="flex-1 flex flex-col space-y-1">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] tracking-widest opacity-70">The Vision</label>
                        <div class="flex gap-4">
                            <button onclick="clearPrompt()" class="text-[9px] font-bold text-red-400 uppercase tracking-tighter">Clear</button>
                            <button onclick="pastePrompt()" class="text-[9px] font-bold text-[var(--accent)] uppercase tracking-tighter">Paste</button>
                        </div>
                    </div>
                    <textarea id="prompt" placeholder="Describe the unseen..." class="w-full flex-1 p-3 resize-none text-sm leading-relaxed min-h-[5rem]"></textarea>
                </div>
                <div class="grid grid-cols-5 gap-3 shrink-0">
                    <div class="col-span-4">
                        <textarea id="negativePrompt" placeholder="Wards (What to banish...)" class="w-full h-11 px-3 py-2 text-xs resize-none"></textarea>
                    </div>
                    <button id="generateBtn" class="col-span-1 btn-magic flex items-center justify-center gap-2 font-bold uppercase text-[10px] tracking-widest shadow-lg">
                        <span id="btnText">Manifest</span>
                        <div id="btnLoader" class="hidden"><div class="loader"></div></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footerStatus" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel py-3 px-8 text-xs font-bold transition-all translate-y-32 opacity-0 pointer-events-none z-[150]"></div>

    <script>
        // FULL CATALOG OF MODELS from star_api.py
        const SFW_MODELS = [
            { "name": "Ani", "profile": "ani" },
            { "name": "Aura", "profile": "aura" },
            { "name": "Evo", "profile": "evo" },
            { "name": "Flux1 D", "profile": "flux1d" },
            { "name": "Fur", "profile": "fur" },
            { "name": "FurXL Classic", "profile": "furxl" },
            { "name": "Gen", "profile": "gen" },
            { "name": "Glitch", "profile": "glitch" },
            { "name": "Gothic", "profile": "gothic" },
            { "name": "Hyper CGI", "profile": "hypercgi" },
            { "name": "HyperX", "profile": "hyperx" },
            { "name": "Muse", "profile": "muse" },
            { "name": "Nai", "profile": "nai" },
            { "name": "Neo", "profile": "neo" },
            { "name": "Noob", "profile": "noob" },
            { "name": "Pixel", "profile": "pixel" },
            { "name": "Pony", "profile": "pony" },
            { "name": "Rend", "profile": "rend" },
            { "name": "Retro", "profile": "retro" },
            { "name": "Supra", "profile": "supra" },
            { "name": "Synth", "profile": "synth" },
            { "name": "Toon", "profile": "toon" },
            { "name": "Volt", "profile": "volt" },
            { "name": "Wassie", "profile": "wassie" }
        ];

        const NSFW_MODELS = [
            { "name": "Gen", "profile": "gen" },
            { "name": "Ani", "profile": "ani" },
            { "name": "Synth", "profile": "synth" },
            { "name": "Fur", "profile": "fur" },
            { "name": "Noob", "profile": "noob" },
            { "name": "Aura", "profile": "aura" },
            { "name": "Pixel", "profile": "pixel" },
            { "name": "Hyper CGI", "profile": "hypercgi" },
            { "name": "Volt", "profile": "volt" },
            { "name": "Muse", "profile": "muse" },
            { "name": "Rend", "profile": "rend" },
            { "name": "Pony", "profile": "pony" },
            { "name": "Neo", "profile": "neo" },
            { "name": "Nai", "profile": "nai" },
            { "name": "Retro", "profile": "retro" },
            { "name": "Supra", "profile": "supra" },
            { "name": "Evo", "profile": "evo" },
            { "name": "Toon", "profile": "toon" },
            { "name": "HyperX", "profile": "hyperx" },
            { "name": "FurXL Classic", "profile": "furxl" },
            { "name": "Illustrious", "profile": "illustrious" },
            { "name": "Real Amateurs", "profile": "real_amateurs" },
            { "name": "RealX", "profile": "realx" },
            { "name": "Real Classic", "profile": "realclassic" }
        ];
        
        let state = { 
            serverUrl: window.location.origin, 
            activeMode: localStorage.getItem("a_mode") || 'standard',
            tasks: [],
            history: JSON.parse(localStorage.getItem("a_history") || "[]")
        };

        const dom = { 
            model: document.getElementById("model"), prompt: document.getElementById("prompt"), negativePrompt: document.getElementById("negativePrompt"), 
            generateBtn: document.getElementById("generateBtn"), btnText: document.getElementById("btnText"), btnLoader: document.getElementById("btnLoader"),
            gallery: document.getElementById("gallery"), count: document.getElementById("count"), aspect: document.getElementById("aspect"), 
            quality: document.getElementById("quality"), seed: document.getElementById("seed"), historyList: document.getElementById("historyList"),
            taskList: document.getElementById("taskList"), main: document.getElementById("mainContent"),
            modal: document.getElementById("modal"), modalContainer: document.getElementById("modalContainer"),
            modalImage: document.getElementById("modalImage"), modalPrompt: document.getElementById("modalPrompt"), 
            downloadImageBtn: document.getElementById("downloadImageBtn")
        };

        function setFooterMsg(msg) {
            const f = document.getElementById("footerStatus"); f.textContent = msg;
            f.classList.remove("translate-y-32", "opacity-0");
            setTimeout(() => f.classList.add("translate-y-32", "opacity-0"), 3000);
        }

        function applyMode(mode) {
            state.activeMode = mode; document.body.dataset.mode = mode;
            const models = mode === 'nsfw' ? NSFW_MODELS : SFW_MODELS;
            dom.model.innerHTML = models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
            dom.quality.innerHTML = ['Fast', 'High Quality'].map(q => `<option value="${q}">${q}</option>`).join('');
            dom.aspect.innerHTML = ['1:1', '16:9', '4:5', '4:7'].map(a => `<option value="${a}">${a}</option>`).join('');
            document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            localStorage.setItem("a_mode", mode);
            renderHistory();
        }

        async function runGeneration() {
            const prompt = dom.prompt.value.trim();
            if (!prompt) return setFooterMsg("Inspiration required.");
            
            const taskId = `v-${Date.now()}`;
            const payload = { 
                prompt, model: dom.model.value, nsfw: state.activeMode === 'nsfw', 
                count: parseInt(dom.count.value), aspect: dom.aspect.value, quality: dom.quality.value,
                negative_prompt: dom.negativePrompt.value, seed: dom.seed.value ? parseInt(dom.seed.value) : null,
                client_id: taskId
            };

            setLoading(true);
            state.tasks.unshift({ id: taskId, prompt, status: 'weaving', payload });
            dom.gallery.innerHTML = '<div class="py-24 animate-pulse opacity-50 cinematic-text text-2xl uppercase tracking-widest">Weaving Vision...</div>';

            try {
                const resp = await fetch(`${state.serverUrl}/generate`, { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                if (!resp.ok) throw new Error("Timeout");
                const res = await resp.json();
                
                const newEntry = { id: taskId, prompt, model: payload.model, image_urls: res.image_urls, created: new Date().toISOString() };
                state.history.unshift(newEntry);
                localStorage.setItem("a_history", JSON.stringify(state.history));
                
                renderVisions(res.image_urls, taskId);
                renderHistory();
            } catch (e) {
                console.warn("Connection lost, entering recovery mode...");
                setFooterMsg("Vision unraveled. Checking server...");
                setTimeout(() => attemptRecovery(taskId, payload), 5000);
            } finally { setLoading(false); }
        }

        async function attemptRecovery(taskId, payload) {
            try {
                const resp = await fetch(`${state.serverUrl}/fetch-by-client-id/${taskId}`);
                if (resp.ok) {
                    const res = await resp.json();
                    if (res.image_urls && res.image_urls.length > 0) {
                        const newEntry = { id: taskId, prompt: payload.prompt, model: payload.model, image_urls: res.image_urls, created: new Date().toISOString() };
                        state.history.unshift(newEntry);
                        localStorage.setItem("a_history", JSON.stringify(state.history));
                        renderVisions(res.image_urls, taskId);
                        renderHistory();
                        setFooterMsg("Vision recovered from Aether.");
                        return;
                    }
                }
                dom.gallery.innerHTML = '<div class="py-24 text-red-400 font-bold uppercase">Vision Lost. Check Queue to retry.</div>';
            } catch(err) {}
        }

        function renderVisions(urls, taskId) {
            state.tasks = state.tasks.filter(t => t.id !== taskId);
            dom.gallery.innerHTML = urls.map(url => `
                <div class="bubble" onclick="openModal({url: '${url}', prompt: '${dom.prompt.value.replace(/'/g, "\\'")}'})">
                    <div class="bubble-img-overlay"><img src="${url}" loading="lazy"></div>
                    <div class="bubble-sphere"></div>
                </div>
            `).join('');
            dom.main.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderHistory() {
            if (!dom.historyList) return;
            if (state.history.length === 0) {
                dom.historyList.innerHTML = '<div class="col-span-full py-12 text-center opacity-20">The Vault is empty.</div>';
                return;
            }
            dom.historyList.innerHTML = state.history.flatMap(entry => 
                entry.image_urls.map(url => `
                    <div class="art-frame" onclick="openModal({url: '${url}', prompt: '${entry.prompt.replace(/'/g, "\\'")}'})">
                        <img src="${url}" class="w-full aspect-square object-cover" loading="lazy">
                    </div>
                `)
            ).join('');
        }

        function openModal(data) {
            dom.modalImage.src = data.url;
            dom.modalPrompt.textContent = data.prompt;
            dom.downloadImageBtn.href = data.url;
            dom.modal.classList.remove('hidden');
            dom.modal.classList.add('flex');
            setTimeout(() => {
                dom.modal.classList.add('opacity-100');
                dom.modalContainer.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            dom.modal.classList.remove('opacity-100');
            dom.modalContainer.classList.add('scale-95');
            setTimeout(() => {
                dom.modal.classList.add('hidden');
                dom.modal.classList.remove('flex');
            }, 500);
        }

        function setLoading(l) {
            dom.generateBtn.disabled = l;
            dom.btnText.textContent = l ? "Weaving..." : "Manifest";
            dom.btnLoader.classList.toggle('hidden', !l);
        }

        function toggleConsole() { 
            const isMin = document.getElementById('desktopConsole').classList.toggle('minimized');
            document.getElementById('consoleToggleText').textContent = isMin ? 'Expand' : 'Minimize';
        }
        
        async function pastePrompt() { dom.prompt.value = await navigator.clipboard.readText(); }
        function clearPrompt() { dom.prompt.value = ''; }

        document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', (e) => {
            const view = e.target.dataset.view;
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.querySelectorAll('[data-view]').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            dom.main.scrollTo({ top: 0, behavior: 'auto' });
        }));

        document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => applyMode(b.dataset.mode)));
        dom.generateBtn.addEventListener('click', runGeneration);
        applyMode(state.activeMode);
    </script>
</body>
</html>
