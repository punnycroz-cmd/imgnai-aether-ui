<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptStore | Aether Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            /* Base Theme (Daylight / SFW / Ghibli Nature) */
            --bg-base: #f0f7f4;
            --blob-1: #a7f3d0;
            --blob-2: #fde68a;
            --blob-3: #99f6e4;
            --panel-bg: rgba(255, 255, 255, 0.45);
            --panel-border: rgba(255, 255, 255, 0.7);
            --panel-shadow: rgba(0, 50, 20, 0.05);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --accent-text: #ffffff;
        }

        body[data-mode="nsfw"] {
            /* Midnight Theme (Starlight / NSFW / Mystical Night) */
            --bg-base: #0f172a;
            --blob-1: #8b5cf6;
            --blob-2: #3b82f6;
            --blob-3: #ec4899;
            --panel-bg: rgba(15, 23, 42, 0.55);
            --panel-border: rgba(255, 255, 255, 0.1);
            --panel-shadow: rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --accent-text: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* FIXED: Prevents whole-page scrolling */
            cursor: default;
        }

        h1, h2, h3, .cinematic-text {
            font-family: 'Cinzel', serif;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 40px var(--panel-shadow);
            border-radius: 2rem;
            transition: all 0.5s ease;
        }

        .nav-pill {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-pill.active {
            color: var(--accent-text);
            background: var(--accent);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        input, select, textarea {
            background: var(--panel-bg) !important;
            border: 2px solid var(--panel-border) !important;
            color: var(--text-main) !important;
            border-radius: 1rem !important;
            transition: all 0.3s ease !important;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px var(--accent-glow) !important;
        }

        .btn-magic {
            background: var(--accent);
            color: var(--accent-text);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 1.25rem;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .btn-magic:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 15px 35px var(--accent-glow);
            transform: translateY(-4px) scale(1.02);
        }

        .art-frame {
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border: 4px solid var(--panel-bg);
            background: var(--panel-bg);
        }

        .art-frame:hover {
            border-color: var(--accent);
            box-shadow: 0 20px 40px var(--accent-glow);
            transform: translateY(-8px) scale(1.02);
        }

        .loader {
            width: 24px; height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom Cinematic Scrollbar */
        main::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Responsive Layout Utilities */
        .bottom-console {
            position: fixed;
            bottom: 1.5rem; /* FIXED: Floating properly near bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1100px;
            z-index: 100;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .bottom-console.minimized {
            transform: translate(-50%, calc(100% - 3.5rem));
            opacity: 0.9;
        }

        .console-content {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .minimized .console-content {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* FIXED: Scrolling Main Area */
        main {
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-top: 8rem;
            padding-bottom: 22rem;
            max-width: none !important;
            display: flex;
            flex-direction: column;
        }

        .view {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        #view-generate { justify-content: center; }

        /* Bubble Gallery */
        @media (hover: hover) and (pointer: fine) {
            .bubble-container:has(.bubble-wrapper:hover) .bubble-wrapper:not(:hover) {
                transform: scale(0.75);
                opacity: 0.55;
                filter: blur(1px);
            }
            .bubble-container:has(.bubble-wrapper:hover) .bubble-wrapper:not(:hover) .bubble-sphere {
                animation-play-state: paused;
            }
            .bubble-container:has(.bubble-wrapper:hover) .bubble-wrapper:hover {
                transform: scale(1.35);
                z-index: 10;
            }
            .bubble-wrapper:hover .bubble-img-overlay { opacity: 1; }
            .bubble:hover .bubble-sphere { transform: none; }
        }

        .bubble-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5rem;
            padding: 2rem;
            min-height: auto;
        }
        @media (max-width: 1023px) {
            .bubble-container {
                flex-direction: column;
                flex-wrap: nowrap;
                gap: 6rem;
                padding: 4rem 1rem 50vh;
                min-height: auto;
            }
        }
        .bubble-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease, filter 0.4s ease;
            will-change: transform;
        }
        @media (max-width: 1023px) { .bubble-wrapper { width: 220px; } }
        .bubble-wrapper:nth-child(2) .bubble { animation-delay: -1.5s; animation-duration: 5s; }
        .bubble-wrapper:nth-child(3) .bubble { animation-delay: -3s; animation-duration: 4.5s; }
        .bubble-wrapper:nth-child(4) .bubble { animation-delay: -0.5s; animation-duration: 6s; }
        
        @keyframes bubbleFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-20px); }
        }
        .bubble {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            overflow: visible;
            animation: bubbleFloat 4s ease-in-out infinite alternate;
        }
        @media (max-width: 1023px) { .bubble { width: 220px; height: 220px; } }

        .bubble-img-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            opacity: 1; /* FIXED: Removed ghost bubble opacity issue */
            transition: opacity 0.6s ease;
            z-index: 1;
        }
        .bubble-img-overlay img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
            filter: saturate(1.3) contrast(0.9); transform: scale(1.1);
        }
        .bubble-sphere {
            width: 100%; height: 100%; border-radius: 50%; position: absolute; inset: 0; z-index: 2;
            background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.9) 0%, rgba(220,200,255,0.5) 10%, rgba(130,100,250,0.18) 28%, rgba(60,200,255,0.08) 50%, rgba(180,80,255,0.15) 72%, rgba(10,5,30,0.45) 100%);
            box-shadow: inset -22px -22px 65px rgba(100,50,200,0.35), inset 12px 12px 45px rgba(255,255,255,0.3), 0 25px 70px rgba(100,50,200,0.45), 0 0 0 1px rgba(255,255,255,0.18);
            animation: bubbleShimmer 5s ease-in-out infinite alternate; transition: transform 0.5s ease;
        }
        @keyframes bubbleShimmer {
            0% { box-shadow: inset -22px -22px 65px rgba(100,50,200,0.35), inset 12px 12px 45px rgba(255,255,255,0.3), 0 25px 70px rgba(100,50,200,0.45), 0 0 0 1px rgba(255,255,255,0.18); }
            50% { box-shadow: inset -14px -14px 75px rgba(60,200,255,0.35), inset 16px 16px 55px rgba(255,200,255,0.35), 0 25px 70px rgba(60,200,255,0.35), 0 0 0 1px rgba(255,255,255,0.22); }
            100% { box-shadow: inset -28px -28px 60px rgba(200,80,255,0.35), inset 8px 8px 38px rgba(255,255,255,0.22), 0 25px 70px rgba(200,80,255,0.45), 0 0 0 1px rgba(255,255,255,0.12); }
        }
        .bubble-sphere::before {
            content: ''; position: absolute; top: 12%; left: 18%; width: 40%; height: 24%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, transparent 100%);
            border-radius: 50%; transform: rotate(-30deg); filter: blur(4px); z-index: 3;
        }
        .bubble-sphere::after {
            content: ''; position: absolute; bottom: 16%; right: 18%; width: 18%; height: 12%;
            background: radial-gradient(ellipse, rgba(200,180,255,0.65) 0%, transparent 100%);
            border-radius: 50%; filter: blur(3px); z-index: 3;
        }
        .bubble-label {
            position: absolute; bottom: -2.2rem; left: 50%; transform: translateX(-50%); font-size: 9px;
            font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
            white-space: nowrap; opacity: 0.5; transition: opacity 0.3s ease;
        }
        .bubble-wrapper:hover .bubble-label { opacity: 1; }
        .bubble-canvas {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; border-radius: 50%; z-index: 50;
        }

        /* Bubble revealed image */
        .bubble-image-reveal {
            position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        .bubble-image-reveal.active { display: flex; opacity: 1; pointer-events: all; }
        .bubble-image-reveal img {
            max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 1.5rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); transform: scale(0.8); transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .bubble-image-reveal.active img { transform: scale(1); }
        .bubble-reform { animation: bubbleReform 0.85s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes bubbleReform {
            0% { transform: scale(0); opacity: 0; filter: blur(24px); }
            60% { transform: scale(1.1); opacity: 0.9; filter: blur(2px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }
        .bubble-pop { animation: bubblePop 0.35s ease forwards; }
        @keyframes bubblePop {
            0% { transform: scale(1); opacity: 1; }
            55% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* R2 Vault Badge */
        .vault-badge {
            position: absolute; top: 12px; right: 12px;
            background: var(--accent); color: white;
            font-size: 8px; font-weight: 800; padding: 2px 8px;
            border-radius: 20px; z-index: 10; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 4px 10px var(--accent-glow);
        }

        .ambient-bg { position: fixed; inset: -20%; z-index: -1; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: float 25s infinite ease-in-out alternate; transition: background 1.5s ease-in-out; }
        .blob-1 { top: 10%; left: 10%; width: 45vw; height: 45vw; background: var(--blob-1); animation-duration: 22s; }
        .blob-2 { bottom: 10%; right: 10%; width: 55vw; height: 55vw; background: var(--blob-2); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 50%; width: 40vw; height: 40vw; background: var(--blob-3); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(3%, 7%) scale(1.03); }
            100% { transform: translate(-3%, -4%) scale(0.97); }
        }
    </style>
</head>

<body data-mode="standard">
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-2xl opacity-0 transition-opacity duration-500">
        <div class="glass-panel max-w-6xl w-full max-h-[90vh] flex flex-col lg:flex-row overflow-hidden shadow-2xl scale-95 transition-transform duration-500" id="modalContainer">
            <div class="flex-1 bg-black/10 flex items-center justify-center p-6">
                <img id="modalImage" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl" />
            </div>
            <div class="w-full lg:w-[400px] p-8 flex flex-col gap-6 bg-white/5 overflow-y-auto border-t lg:border-l border-white/10">
                <h3 class="text-3xl font-bold cinematic-text">Manifestation</h3>
                <div class="space-y-4">
                    <div class="p-4 bg-[var(--panel-bg)] rounded-xl border border-[var(--panel-border)] shadow-sm">
                        <p class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] mb-1 font-bold">The Vision</p>
                        <p id="modalPrompt" class="text-sm font-medium italic"></p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-[var(--panel-bg)] rounded-xl border border-[var(--panel-border)] transition-all">
                            <p class="text-[10px] uppercase font-bold text-[var(--text-muted)]">Brush</p>
                            <p id="modalModel" class="font-bold text-sm"></p>
                        </div>
                        <div class="p-4 bg-[var(--panel-bg)] rounded-xl border border-[var(--panel-border)]">
                            <p class="text-[10px] uppercase font-bold text-[var(--text-muted)]">Seed</p>
                            <p id="modalSeed" class="font-bold text-sm"></p>
                        </div>
                    </div>
                </div>
                <div class="mt-auto space-y-4 pb-8 lg:pb-0">
                    <a id="downloadImageBtn" href="#" download class="block w-full py-4 btn-magic font-bold text-center uppercase tracking-widest shadow-xl">Save Image</a>
                    <button onclick="closeModal()" class="w-full py-3 text-[var(--text-muted)] font-bold uppercase tracking-widest text-xs hover:text-[var(--text-main)] transition-colors">Close</button>
                </div>
            </div>
        </div>
    </div>

    <header class="fixed top-6 left-0 right-0 z-[110] px-8">
        <div class="max-w-7xl mx-auto glass-panel p-4 border-t-4 border-t-[var(--accent)] flex items-center justify-between gap-8 shadow-2xl">
            <div class="flex items-center gap-4 shrink-0">
                <div class="w-10 h-10 rounded-lg bg-[var(--accent)] text-white flex items-center justify-center shadow-lg transform -rotate-3 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></svg>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-xl font-black cinematic-text tracking-widest leading-none">AETHER</h1>
                    <p class="text-[10px] text-[var(--text-muted)] font-medium italic tracking-wide mt-0.5">Weave the <span class="text-[var(--accent)] font-bold">Imagination</span></p>
                </div>
            </div>
            <nav class="flex items-center gap-2 bg-black/5 p-1 rounded-2xl mx-auto lg:mx-0">
                <button data-view="generate" class="nav-pill active px-5 lg:px-6 py-2 rounded-xl font-bold uppercase tracking-widest text-[10px]">Forge</button>
                <button data-view="tasks" class="nav-pill px-5 lg:px-6 py-2 rounded-xl font-bold uppercase tracking-widest text-[10px]">Queue</button>
                <button data-view="history" class="nav-pill px-5 lg:px-6 py-2 rounded-xl font-bold uppercase tracking-widest text-[10px]">Vault</button>
            </nav>
            <div class="w-10 h-10 sm:hidden"></div>
        </div>
    </header>

    <main id="mainContent" class="max-w-7xl mx-auto px-4 md:px-8">
        <section id="view-generate" class="view space-y-4 md:space-y-6">
            <div class="space-y-6">
                <div class="w-full relative" id="easelSection">
                    <div class="flex items-center justify-between px-4 pb-3 mb-1">
                        <h3 class="text-lg cinematic-text font-bold text-[var(--text-muted)] opacity-60 tracking-widest uppercase">The Easel</h3>
                        <div id="imageCount" class="text-[9px] font-bold text-[var(--accent)] bg-[var(--accent-glow)] px-3 py-1 rounded-full border border-[var(--accent)]">0 Spirits</div>
                    </div>
                    <div id="gallery" class="bubble-container">
                        <div id="galleryEmpty" class="w-full py-24 opacity-10 text-center space-y-6 col-span-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 mx-auto animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><path d="M8 12a5 5 0 0 1 8 0"/><line x1="12" x2="12" y1="8" y2="8"/></svg>
                            <p class="text-3xl font-thin cinematic-text tracking-[0.3em] uppercase">Void Awaiting Light</p>
                        </div>
                    </div>
                    <div id="bubbleReveal" class="bubble-image-reveal" onclick="closeBubbleReveal(event)">
                        <div id="bubbleRevealInner" class="relative">
                            <img id="bubbleRevealImg" src="" alt="">
                            <button onclick="closeBubbleReveal()" class="absolute -top-4 -right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 flex items-center justify-center text-white font-bold text-lg transition-all">&times;</button>
                            <div class="flex justify-center mt-6 gap-4">
                                <a id="bubbleRevealDownload" href="#" download class="px-6 py-2 btn-magic text-[10px] font-bold uppercase tracking-widest">Save Image</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-tasks" class="view hidden">
            <div class="glass-panel p-10 min-h-[400px]">
                <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-4">
                    <h2 class="text-4xl font-bold cinematic-text">Active Journeys</h2>
                    <button onclick="clearQueue()" class="px-6 py-2 bg-white/10 hover:bg-white/20 text-[var(--text-muted)] border border-[var(--panel-border)] rounded-full text-[10px] font-bold uppercase tracking-widest transition-all">Clear Finished</button>
                </div>
                <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>
        </section>
        <section id="view-history" class="view hidden">
            <div class="glass-panel p-10 min-h-[400px]">
                <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-4">
                    <h2 class="text-4xl font-bold cinematic-text">The Vault</h2>
                    <button onclick="clearHistory()" class="px-6 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 rounded-full text-[10px] font-bold uppercase tracking-widest transition-all">Purge Vault</button>
                </div>
                <div id="historyList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
            </div>
        </section>
    </main>

    <div id="desktopConsole" class="bottom-console glass-panel p-4 border-2 border-[var(--accent)] relative">
        <button onclick="toggleConsole()" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-[var(--accent)] text-white px-6 py-2 rounded-t-xl font-bold text-[10px] uppercase tracking-widest shadow-lg">
            <span id="consoleToggleText">Minimize</span>
        </button>

        <div class="console-content grid grid-cols-12 gap-4 items-stretch">
            <div class="col-span-12 lg:col-span-4 flex flex-col gap-3">
                <div class="flex items-center gap-1 bg-[var(--panel-bg)] border border-[var(--panel-border)] p-1 rounded-xl h-10 shrink-0">
                    <button data-mode="standard" class="nav-pill active w-1/2 h-full rounded-lg text-[9px] font-bold uppercase tracking-widest">Day</button>
                    <button data-mode="nsfw" class="nav-pill w-1/2 h-full rounded-lg text-[9px] font-bold uppercase tracking-widest">Star</button>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Engine</label>
                    <select id="model" class="w-full h-10 px-3 font-bold text-xs"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Fidelity</label>
                        <select id="quality" class="w-full h-10 px-3 font-bold text-xs"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-bold uppercase text-[var(--text-muted)] ml-1 opacity-70 tracking-widest">Canvas</label>
                        <select id="aspect" class="w-full h-10 px-3 font-bold text-xs"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">

        }

        function clearHistory() {
            if (confirm("Are you sure you wish to purge the Vault? This cannot be undone.")) {
                state.history = [];
                persist();
                renderArchive();
                setFooterMsg("Vault Purged.");
            }
        }

        function deleteHistoryImage(taskId, url) {
            const item = state.history.find(h => h.id === taskId);
            if (item) {
                const index = item.image_urls.indexOf(url);
                if (index > -1) {
                    item.image_urls.splice(index, 1);
                }
                if (item.image_urls.length === 0) {
                    state.history = state.history.filter(h => h.id !== taskId);
                }
                persist();
                renderArchive();
            }
        }

        function renderQueue() {
            if (state.tasks.length === 0) { dom.taskList.innerHTML = `<div class="col-span-full py-20 text-center opacity-20 font-bold cinematic-text text-3xl">No active journeys</div>`; return; }
            
            const groups = {};
            state.tasks.forEach(t => {
                const d = new Date(t.created);
                const dateStr = isNaN(d.getTime()) ? 'Ongoing Visions' : d.toLocaleDateString(undefined, {year: 'numeric', month: 'long', day: 'numeric'});
                if (!groups[dateStr]) groups[dateStr] = [];
                groups[dateStr].push(t);
            });

            let html = '';
            for (const [date, items] of Object.entries(groups)) {
                html += `<div class="col-span-full mt-4 mb-2"><h3 class="text-xs font-bold uppercase tracking-widest text-[var(--accent)] opacity-80">${date}</h3></div>`;
                html += items.map(t => `
                    <div class="p-6 glass-panel border-2 ${t.status === 'weaving' ? 'border-[var(--accent)]' : (t.status === 'failed' ? 'border-red-500/50' : 'border-[var(--panel-border)]')} space-y-4 relative group">
                        <button onclick="removeTask('${t.id}')" class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity text-xs text-red-500">×</button>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold uppercase ${t.status === 'weaving' ? 'animate-pulse text-[var(--accent)]' : (t.status === 'failed' ? 'text-red-400' : 'text-[var(--text-muted)]')}">
                                ${t.status}
                            </span>
                            <span class="text-[10px] opacity-40">${!isNaN(new Date(t.created).getTime()) ? new Date(t.created).toLocaleTimeString() : t.created}</span>
                        </div>
                        <p class="text-sm font-bold italic truncate">"${t.prompt}"</p>
                        ${t.status === 'failed' ? `<button onclick="retryTask('${t.id}')" class="w-full py-2 text-[10px] font-bold uppercase tracking-widest bg-red-500/20 hover:bg-red-500/40 border border-red-500/50 text-red-200 transition-all rounded">Retry Weaving</button>` : ''}
                    </div>
                `).join('');
            }
            dom.taskList.innerHTML = html;
        }

        function removeTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            persist();
            renderQueue();
        }

        function clearQueue() {
            state.tasks = state.tasks.filter(t => t.status === 'weaving');
            persist();
            renderQueue();
        }

        document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
        document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => applyMode(b.dataset.mode)));
        dom.model.addEventListener('change', () => { state.lastModelByMode[state.activeMode] = dom.model.value; loadDefaults(); persist(); });

        // Generate / Recovery Logic
        async function runGeneration(retryId = null) {
            let taskId, payload, userQty;
            
            if (retryId) {
                const existing = state.tasks.find(t => t.id === retryId);
                if (!existing) return;
                taskId = existing.id;
                payload = existing.payload || existing; 
                userQty = existing.displayCount || 4;
                existing.status = 'weaving';
            } else {
                const prompt = dom.prompt.value.trim();
                if (!prompt) { setFooterMsg("Inspiration required."); return; }
                taskId = `v-${Date.now()}`;
                userQty = Number(dom.count.value);
                payload = { 
                    model: dom.model.value, 
                    count: 4, 
                    quality: dom.quality.value, 
                    aspect: dom.aspect.value, 
                    prompt, 
                    negative_prompt: dom.negativePrompt.value, 
                    seed: dom.seed && dom.seed.value ? Number(dom.seed.value) : null, 
                    nsfw: state.activeMode === 'nsfw',
                    client_id: taskId,
                    realm: state.activeMode
                };
                state.tasks.unshift({ id: taskId, ...payload, displayCount: userQty, status: 'weaving', created: new Date().toLocaleString(), payload: payload });
            }
            
            renderQueue();
            const setLoading = (loading) => {
                dom.generateBtn.disabled = loading;
                if (loading) {
                    dom.btnText.textContent = "Weaving..."; 
                    dom.btnLoader.classList.remove('hidden');
                } else {
                    dom.btnText.textContent = "Manifest";
                    dom.btnLoader.classList.add('hidden');
                }
            };

            if (!retryId) {
                setLoading(true);
                dom.gallery.innerHTML = '<div class="col-span-full py-12 text-center cinematic-text text-xl animate-pulse opacity-40 uppercase tracking-[0.2em]">Weaving the unseen...</div>';
            }
            
            try {
                const resp = await fetch(`${state.serverUrl}/generate`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload)
                });
                
                if (!resp.ok) throw new Error("Network response was not ok");
                
                const res = await resp.json();
                handleSuccessfulGeneration(taskId, res, payload, userQty);

            } catch (e) { 
                console.error("Generation Error:", e);
                setFooterMsg("Connection lost. Checking server status...");
                setTimeout(() => attemptRecovery(taskId, payload, userQty), 5000);
            }
            finally { if (!retryId) setLoading(false); persist(); }
        }

        async function attemptRecovery(taskId, payload, userQty) {
            try {
                const check = await fetch(`${state.serverUrl}/fetch-by-client-id/${taskId}`);
                if (check.ok) {
                    const res = await check.json();
                    if (res.image_urls && res.image_urls.length > 0) {
                        handleSuccessfulGeneration(taskId, res, payload, userQty);
                        setFooterMsg("Vision recovered from Aether.");
                        return;
                    }
                }
                const task = state.tasks.find(t => t.id === taskId);
                if (task) {
                    task.status = 'failed';
                    renderQueue();
                    dom.gallery.innerHTML = '<div class="col-span-full py-12 text-center cinematic-text text-xl text-red-500/60 uppercase tracking-[0.2em]">Vision unraveled. Check Queue to repair.</div>';
                }
            } catch(err) {}
        }

        function handleSuccessfulGeneration(taskId, res, payload, userQty) {
            const displayUrls = res.image_urls.slice(0, userQty);
            
            state.tasks = state.tasks.filter(t => t.id !== taskId);
            state.history = state.history.filter(h => h.id !== taskId); // Prevent duplicates
            state.history.unshift({ 
                id: taskId, 
                model: payload.model,
                prompt: payload.prompt,
                seed: payload.seed,
                image_urls: displayUrls, 
                created: new Date().toLocaleString() 
            });
            
            dom.gallery.innerHTML = '';
            const empty = document.getElementById('galleryEmpty');
            if(empty) empty.remove();

            displayUrls.forEach((url, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'bubble-wrapper';
                wrapper.style.animationDelay = `${-idx * 1.5}s`;
                const badge = (url.includes('.r2.cloudflarestorage.com') || url.includes('.r2.dev')) ? '<span class="vault-badge">Vaulted</span>' : '';
                wrapper.innerHTML = `
                    <div class="bubble" id="bubble-${taskId}-${idx}" onclick="popBubble(this, '${url}', '${payload.model}', '${payload.prompt.replace(/'/g, '\\')}')">
                        ${badge}
                        <div class="bubble-img-overlay"><img src="${url}" alt="" loading="lazy"></div>
                        <div class="bubble-sphere"></div>
                        <canvas class="bubble-canvas" width="260" height="260"></canvas>
                    </div>
                    <span class="bubble-label">Spirit ${idx + 1}</span>
                `;
                dom.gallery.appendChild(wrapper);
            });

            dom.imageCount.textContent = `${displayUrls.length} Spirits`;
            renderArchive(); renderQueue(); setFooterMsg("Vision complete.");
            
            const console = document.getElementById('desktopConsole');
            if (!console.classList.contains('minimized')) {
                setTimeout(toggleConsole, 1000);
            }
            dom.main.scrollTo({ top: 0, behavior: 'smooth' });
            persist();
        }

        window.retryTask = async (id) => {
            const task = state.tasks.find(t => t.id === id);
            if (!task || task.status === 'retrying' || task.status === 'weaving') return;
            task.status = 'retrying';
            renderQueue();
            
            setFooterMsg("Checking server for existing vision...");
            try {
                const check = await fetch(`${state.serverUrl}/fetch-by-client-id/${id}`);
                if (check.ok) {
                    const res = await check.json();
                    if (res.image_urls && res.image_urls.length > 0) {
                        handleSuccessfulGeneration(id, res, task.payload || task, task.displayCount || 4);
                        setFooterMsg("Vision retrieved from Aether.");
                        return;
                    }
                }
            } catch (e) {
                console.log("No existing task found, falling back to new generation.");
            }
            if (task) task.status = 'failed';
            runGeneration(id);
        };
        dom.generateBtn.addEventListener('click', () => runGeneration());

        // Sync Selects
        dom.model.addEventListener('change', (e) => {
            state.lastModelByMode[state.activeMode] = e.target.value;
            loadDefaults(); persist();
        });
        dom.aspect.addEventListener('change', (e) => { state.aspect = e.target.value; persist(); });
        dom.quality.addEventListener('change', (e) => { state.quality = e.target.value; persist(); });
        dom.count.addEventListener('change', () => { state.count = dom.count.value; persist(); });

        async function pastePrompt() {
            try {
                const text = await navigator.clipboard.readText();
                dom.prompt.value = text;
                setFooterMsg("Vision received.");
            } catch (err) { setFooterMsg("Clipboard locked."); }
        }
        function clearPrompt() {
            dom.prompt.value = '';
            setFooterMsg("Canvas cleared.");
        }

        window.pastePrompt = pastePrompt;
        window.clearPrompt = clearPrompt;

        // --- Bubble gallery functions ---
        let _activeBubbleId = null;

        function popBubble(bubbleEl, imgUrl, model, prompt) {
            const sphere = bubbleEl.querySelector('.bubble-sphere');
            const canvas = bubbleEl.querySelector('.bubble-canvas');
            const ctx = canvas.getContext('2d');

            // Save reference to reform later
            _activeBubbleId = bubbleEl.id;

            // Particle shatter effect
            const cx = 120, cy = 120, r = 110;
            const particles = [];
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                const hue = Math.round(Math.random() * 80 + 200);
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 3,
                    size: 3 + Math.random() * 8,
                    alpha: 0.9,
                    color: `hsl(${hue}, 80%, 75%)`,
                });
            }

            // Pop sphere visually
            sphere.classList.add('bubble-pop');
            if (canvas) canvas.style.display = 'block';

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, 260, 260);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.35;
                    p.alpha -= 0.025;
                    p.size *= 0.97;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                frame++;
                if (frame < 52) requestAnimationFrame(animate);
                else {
                    ctx.clearRect(0, 0, 260, 260);
                    if (canvas) canvas.style.display = 'none';
                }
            }
            animate();

            // Show image reveal
            setTimeout(() => {
                const reveal = document.getElementById('bubbleReveal');
                const img = document.getElementById('bubbleRevealImg');
                const dl = document.getElementById('bubbleRevealDownload');
                img.src = imgUrl;
                dl.href = imgUrl;
                reveal.style.display = 'flex';
                setTimeout(() => reveal.classList.add('active'), 10);
            }, 200);
        }

        function closeBubbleReveal(e) {
            if (e && e.target !== document.getElementById('bubbleReveal') && !e.target.closest('button')) return;
            const reveal = document.getElementById('bubbleReveal');
            reveal.classList.remove('active');
            setTimeout(() => {
                if (!reveal.classList.contains('active')) reveal.style.display = 'none';
            }, 500);

            // Reform bubble
            if (_activeBubbleId) {
                const bubbleEl = document.getElementById(_activeBubbleId);
                if (bubbleEl) {
                    const sphere = bubbleEl.querySelector('.bubble-sphere');
                    const canvas = bubbleEl.querySelector('.bubble-canvas');
                    // Fully reset canvas before reform
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 260, 260);
                        canvas.style.display = 'none';
                    }
                    sphere.classList.remove('bubble-pop');
                    sphere.style.transform = '';
                    sphere.classList.add('bubble-reform');
                    setTimeout(() => sphere.classList.remove('bubble-reform'), 900);
                }
                _activeBubbleId = null;
            }
        }

        window.popBubble = popBubble;
        window.closeBubbleReveal = closeBubbleReveal;

        function toggleConsole() {
            const console = document.getElementById('desktopConsole');
            const toggleText = document.getElementById('consoleToggleText');
            const isMinimized = console.classList.toggle('minimized');
            toggleText.textContent = isMinimized ? 'Expand' : 'Minimize';
        }

        document.body.classList.add('has-console');
        window.toggleConsole = toggleConsole;
        applyMode(state.activeMode); setView(state.activeView);
        window.openModal = openModal; window.closeModal = closeModal;
    </script>
</body>
