<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptStore | Aether Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-base: #f0f7f4;
            --panel-bg: rgba(255, 255, 255, 0.45);
            --panel-border: rgba(255, 255, 255, 0.7);
            --panel-shadow: rgba(0, 50, 20, 0.1);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --accent-text: #ffffff;
        }

        body[data-mode="nsfw"] {
            --bg-base: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            --panel-shadow: rgba(0, 0, 0, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --accent-text: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 1.5s ease, color 0.5s ease;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, .cinematic-text { font-family: 'Cinzel', serif; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 20px 40px var(--panel-shadow);
            border-radius: 2rem;
        }

        .nav-pill { transition: all 0.4s; color: var(--text-muted); cursor: pointer; }
        .nav-pill.active { color: var(--accent-text); background: var(--accent); box-shadow: 0 8px 20px var(--accent-glow); }

        textarea, select, input {
            background: var(--panel-bg) !important;
            border: 2px solid var(--panel-border) !important;
            color: var(--text-main) !important;
            border-radius: 1rem !important;
            transition: all 0.3s ease !important;
        }

        .btn-magic {
            background: var(--accent);
            color: var(--accent-text);
            transition: all 0.4s;
            border-radius: 1.25rem;
            cursor: pointer;
        }

        .btn-magic:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 15px 35px var(--accent-glow);
            transform: translateY(-4px);
        }

        .bottom-console {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1100px;
            z-index: 100;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .bottom-console.minimized { transform: translate(-50%, calc(100% - 3.5rem)); opacity: 0.9; }

        main {
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-top: 8rem;
            padding-bottom: 22rem;
        }

        .bubble-container { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 5rem; padding: 2rem; }
        .bubble { width: 240px; height: 240px; border-radius: 50%; position: relative; cursor: pointer; animation: float 4s infinite alternate ease-in-out; }
        @keyframes float { from { transform: translateY(0px); } to { transform: translateY(-20px); } }

        .bubble-img-overlay { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; opacity: 1; z-index: 1; }
        .bubble-img-overlay img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .bubble-sphere { width: 100%; height: 100%; border-radius: 50%; position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4) 0%, transparent 60%); border: 1px solid rgba(255,255,255,0.2); }

        .vault-badge {
            position: absolute; top: 12px; right: 12px;
            background: var(--accent); color: white;
            font-size: 8px; font-weight: 800; padding: 2px 8px;
            border-radius: 20px; z-index: 10; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 4px 10px var(--accent-glow);
        }

        .loader { width: 20px; height: 20px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        main::-webkit-scrollbar { width: 0px; }
        .art-frame { border-radius: 1.5rem; overflow: hidden; position: relative; transition: all 0.5s ease; background: var(--panel-bg); cursor: pointer; border: 3px solid transparent; }
        .art-frame:hover { transform: translateY(-8px); border-color: var(--accent); }

        .bubble-canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; border-radius: 50%; z-index: 50; }

        .bubble-image-reveal {
            position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); opacity: 0; transition: opacity 0.5s ease;
        }
        .bubble-image-reveal.active { display: flex; opacity: 1; }
        .bubble-image-reveal img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 1.5rem; transform: scale(0.8); transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); }
        .bubble-image-reveal.active img { transform: scale(1); }
    </style>
</head>

<body data-mode="standard">
    <header class="fixed top-6 left-0 right-0 z-[110] px-8">
        <div class="max-w-7xl mx-auto glass-panel p-4 border-t-4 border-t-[var(--accent)] flex items-center justify-between shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-[var(--accent)] text-white flex items-center justify-center shadow-lg transform -rotate-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></svg>
                </div>
                <h1 class="text-xl font-black cinematic-text tracking-widest hidden sm:block">AETHER</h1>
            </div>
            <nav class="flex items-center gap-2 bg-black/5 p-1 rounded-2xl mx-auto">
                <button data-view="generate" class="nav-pill active px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Forge</button>
                <button data-view="tasks" class="nav-pill px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Queue</button>
                <button data-view="history" class="nav-pill px-5 py-2 rounded-xl font-bold uppercase text-[10px] tracking-widest">Vault</button>
            </nav>
            <div class="w-10 h-10 sm:hidden"></div>
        </div>
    </header>

    <div id="bubbleReveal" class="bubble-image-reveal" onclick="closeBubbleReveal(event)">
        <div class="relative">
            <img id="bubbleRevealImg" src="" alt="">
            <button onclick="closeBubbleReveal()" class="absolute -top-4 -right-4 w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white font-bold text-lg">&times;</button>
            <div class="flex justify-center mt-6 gap-4">
                <a id="bubbleRevealDownload" href="#" download class="px-6 py-2 btn-magic text-[10px] font-bold uppercase tracking-widest">Save Image</a>
            </div>
        </div>
    </div>

    <main id="mainContent">
        <section id="view-generate" class="view">
            <div id="gallery" class="bubble-container">
                <div id="galleryEmpty" class="py-32 text-center opacity-10 text-3xl font-light cinematic-text tracking-[0.3em] uppercase">Void Awaiting Light</div>
            </div>
        </section>

        <section id="view-tasks" class="view hidden px-8">
            <div class="max-w-7xl mx-auto glass-panel p-10 min-h-[400px]">
                <h2 class="text-4xl font-bold cinematic-text mb-8">Active Journeys</h2>
                <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </section>

        <section id="view-history" class="view hidden px-8">
            <div class="max-w-7xl mx-auto glass-panel p-10 min-h-[400px]">
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-4xl font-bold cinematic-text">The Vault</h2>
                    <button onclick="clearVault()" class="text-[10px] font-bold uppercase text-red-500 hover:opacity-70">Purge Vault</button>
                </div>
                <div id="historyList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </section>
    </main>

    <div id="desktopConsole" class="bottom-console glass-panel p-4 border-2 border-[var(--accent)]">
        <button onclick="toggleConsole()" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-[var(--accent)] text-white px-6 py-2 rounded-t-xl font-bold text-[10px] uppercase tracking-widest shadow-lg">
            <span id="consoleToggleText">Minimize</span>
        </button>

        <div class="grid grid-cols-12 gap-4 items-stretch">
            <div class="col-span-12 lg:col-span-4 flex flex-col gap-3">
                <div class="flex items-center gap-1 bg-black/5 p-1 rounded-xl h-9">
                    <button data-mode="standard" class="nav-pill active w-1/2 h-full rounded-lg text-[9px] font-bold uppercase">Day</button>
                    <button data-mode="nsfw" class="nav-pill w-1/2 h-full rounded-lg text-[9px] font-bold uppercase">Star</button>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-bold uppercase opacity-50 ml-1">Engine</label>
                    <select id="model" class="w-full h-9 px-3 font-bold text-xs"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <select id="quality" class="w-full h-9 px-3 font-bold text-xs"></select>
                    <select id="aspect" class="w-full h-9 px-3 font-bold text-xs"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <select id="count" class="w-full h-9 px-3 font-bold text-xs">
                        <option value="1">1 Spirit</option>
                        <option value="4" selected>4 Spirits</option>
                    </select>
                    <input id="seed" type="number" placeholder="Divine Seed" class="w-full h-9 px-3 font-bold text-xs">
                </div>
            </div>

            <div class="col-span-12 lg:col-span-8 flex flex-col gap-3">
                <div class="flex-1 flex flex-col space-y-1">
                    <div class="flex justify-between px-1">
                        <label class="text-[9px] font-bold uppercase opacity-50">The Vision</label>
                        <div class="flex gap-4">
                            <button onclick="clearPrompt()" class="text-[9px] font-bold text-red-400 uppercase">Clear</button>
                            <button onclick="pastePrompt()" class="text-[9px] font-bold text-[var(--accent)] uppercase">Paste</button>
                        </div>
                    </div>
                    <textarea id="prompt" placeholder="What do you seek to manifest?" class="w-full flex-1 p-3 resize-none text-sm leading-relaxed"></textarea>
                </div>
                <div class="grid grid-cols-5 gap-3">
                    <div class="col-span-4">
                        <textarea id="negativePrompt" placeholder="Wards (Banish artifacts...)" class="w-full h-11 px-3 py-2 text-xs resize-none"></textarea>
                    </div>
                    <button id="generateBtn" class="col-span-1 btn-magic flex items-center justify-center gap-2 font-bold uppercase text-[10px] tracking-widest shadow-lg">
                        <span id="btnText">Manifest</span>
                        <div id="btnLoader" class="hidden"><div class="loader"></div></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="footerStatus" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel py-3 px-8 text-xs font-bold transition-all translate-y-32 opacity-0 pointer-events-none z-[150]"></div>

    <script>
        // Render / Environment Placeholders
        window.__SERVER_URL__ = "__SERVER_URL__";
        window.__SERVER_URL_NSFW__ = "__SERVER_URL_NSFW__";

        const SFW_MODELS = [
            { "name": "Ani", "profile": "ani" }, { "name": "Aura", "profile": "aura" }, { "name": "Evo", "profile": "evo" },
            { "name": "Flux1 D", "profile": "flux1d" }, { "name": "Fur", "profile": "fur" }, { "name": "Gen", "profile": "gen" },
            { "name": "Hyper CGI", "profile": "hypercgi" }, { "name": "Neo", "profile": "neo" }
        ];
        const NSFW_MODELS = [
            { "name": "Gen", "profile": "gen" }, { "name": "Real Classic", "profile": "realclassic" }, 
            { "name": "Synth", "profile": "synth" }, { "name": "Toon", "profile": "toon" },
            { "name": "Real Amateurs", "profile": "real_amateurs" }
        ];
        
        /**
         * Resolves the correct backend URL based on current mode and env variables
         */
        function resolveServerUrl(mode) {
            const std = window.__SERVER_URL__;
            const nsfw = window.__SERVER_URL_NSFW__;
            
            // Checks if the placeholder string is still present
            const isUnresolved = (val) => !val || val.startsWith("__") || val.includes("REPLACE");
            
            const finalStd = isUnresolved(std) ? window.location.origin : std;
            const finalNsfw = isUnresolved(nsfw) ? finalStd : nsfw;
            
            const target = mode === 'nsfw' ? finalNsfw : finalStd;
            return target.replace(/\/$/, "");
        }

        let state = { 
            serverUrl: resolveServerUrl('standard'), 
            activeMode: localStorage.getItem("a_mode") || 'standard',
            tasks: [],
            history: JSON.parse(localStorage.getItem("a_history") || "[]")
        };

        const dom = { 
            model: document.getElementById("model"), prompt: document.getElementById("prompt"), negativePrompt: document.getElementById("negativePrompt"), 
            generateBtn: document.getElementById("generateBtn"), btnText: document.getElementById("btnText"), btnLoader: document.getElementById("btnLoader"),
            gallery: document.getElementById("gallery"), count: document.getElementById("count"), aspect: document.getElementById("aspect"), 
            quality: document.getElementById("quality"), seed: document.getElementById("seed"), historyList: document.getElementById("historyList"),
            taskList: document.getElementById("taskList"), main: document.getElementById("mainContent")
        };

        function setFooterMsg(msg) {
            const f = document.getElementById("footerStatus"); f.textContent = msg;
            f.classList.remove("translate-y-32", "opacity-0");
            setTimeout(() => f.classList.add("translate-y-32", "opacity-0"), 3000);
        }

        function applyMode(mode) {
            state.activeMode = mode; document.body.dataset.mode = mode;
            state.serverUrl = resolveServerUrl(mode); // Update URL on toggle
            
            const models = mode === 'nsfw' ? NSFW_MODELS : SFW_MODELS;
            dom.model.innerHTML = models.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
            dom.quality.innerHTML = ['Fast', 'High Quality'].map(q => `<option value="${q}">${q}</option>`).join('');
            dom.aspect.innerHTML = ['1:1', '16:9', '4:5', '4:7'].map(a => `<option value="${a}">${a}</option>`).join('');
            document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            localStorage.setItem("a_mode", mode);
            renderHistory();
        }

        async function runGeneration() {
            const prompt = dom.prompt.value.trim();
            if (!prompt) return setFooterMsg("Inspiration required.");
            const taskId = `v-${Date.now()}`;
            const payload = { 
                prompt, model: dom.model.value, nsfw: state.activeMode === 'nsfw', 
                count: parseInt(dom.count.value), aspect: dom.aspect.value, quality: dom.quality.value,
                negative_prompt: dom.negativePrompt.value, seed: dom.seed.value ? parseInt(dom.seed.value) : null,
                client_id: taskId
            };

            setLoading(true);
            state.tasks.unshift({ id: taskId, prompt, status: 'weaving', payload });
            dom.gallery.innerHTML = '<div class="py-24 animate-pulse opacity-50 cinematic-text text-2xl uppercase tracking-widest">Weaving Vision...</div>';

            try {
                const resp = await fetch(`${state.serverUrl}/generate`, { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                if (!resp.ok) throw new Error("Timeout");
                const res = await resp.json();
                handleSuccess(res.image_urls, taskId, payload);
            } catch (e) {
                setFooterMsg("Vision unraveled. Recovering...");
                setTimeout(() => attemptRecovery(taskId, payload), 5000);
            } finally { setLoading(false); }
        }

        async function attemptRecovery(taskId, payload) {
            try {
                const resp = await fetch(`${state.serverUrl}/fetch-by-client-id/${taskId}`);
                if (resp.ok) {
                    const res = await resp.json();
                    if (res.image_urls && res.image_urls.length > 0) {
                        handleSuccess(res.image_urls, taskId, payload);
                        setFooterMsg("Vision recovered from Aether.");
                        return;
                    }
                }
            } catch(err) {}
            dom.gallery.innerHTML = '<div class="py-24 text-red-400 font-bold uppercase">Vision Lost. Check Queue.</div>';
        }

        function handleSuccess(urls, taskId, payload) {
            state.tasks = state.tasks.filter(t => t.id !== taskId);
            state.history.unshift({ id: taskId, prompt: payload.prompt, model: payload.model, image_urls: urls, created: new Date().toISOString() });
            localStorage.setItem("a_history", JSON.stringify(state.history));
            
            dom.gallery.innerHTML = '';
            urls.forEach((url, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'bubble';
                wrapper.id = `bubble-${taskId}-${idx}`;
                const vaulted = (url.includes('.r2.dev') || url.includes('cloudflare')) ? '<span class="vault-badge">Vaulted</span>' : '';
                wrapper.innerHTML = `
                    ${vaulted}
                    <div class="bubble-img-overlay"><img src="${url}" loading="lazy"></div>
                    <div class="bubble-sphere"></div>
                    <canvas class="bubble-canvas" width="260" height="260"></canvas>
                `;
                wrapper.onclick = () => popBubble(wrapper, url);
                dom.gallery.appendChild(wrapper);
            });
            renderHistory();
        }

        function popBubble(el, url) {
            const canvas = el.querySelector('canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({ x: 130, y: 130, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, size: Math.random()*5, alpha: 1 });
            }
            function animate() {
                ctx.clearRect(0,0,260,260);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                    ctx.fillStyle = `rgba(139, 92, 246, ${p.alpha})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                });
                if (particles[0].alpha > 0) requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => {
                const reveal = document.getElementById('bubbleReveal');
                document.getElementById('bubbleRevealImg').src = url;
                document.getElementById('bubbleRevealDownload').href = url;
                reveal.style.display = 'flex';
                setTimeout(() => reveal.classList.add('active'), 10);
            }, 200);
        }

        function closeBubbleReveal(e) {
            if (e && e.target.tagName === 'IMG') return;
            const reveal = document.getElementById('bubbleReveal');
            reveal.classList.remove('active');
            setTimeout(() => reveal.style.display = 'none', 500);
        }

        function renderHistory() {
            if (!dom.historyList) return;
            dom.historyList.innerHTML = state.history.flatMap(entry => 
                entry.image_urls.map(url => `
                    <div class="art-frame" onclick="popBubble(this, '${url}')">
                        ${(url.includes('.r2.dev') || url.includes('cloudflare')) ? '<span class="vault-badge">Vaulted</span>' : ''}
                        <img src="${url}" class="w-full aspect-square object-cover" loading="lazy">
                    </div>
                `)
            ).join('') || '<div class="col-span-full py-12 text-center opacity-20">Vault empty.</div>';
        }

        function setLoading(l) {
            dom.generateBtn.disabled = l;
            dom.btnText.textContent = l ? "Weaving..." : "Manifest";
            dom.btnLoader.classList.toggle('hidden', !l);
        }

        function toggleConsole() { 
            const isMin = document.getElementById('desktopConsole').classList.toggle('minimized');
            document.getElementById('consoleToggleText').textContent = isMin ? 'Expand' : 'Minimize';
        }
        
        async function pastePrompt() { 
            try {
                const text = await navigator.clipboard.readText();
                dom.prompt.value = text;
            } catch(e) { setFooterMsg("Clipboard permission denied."); }
        }
        function clearPrompt() { dom.prompt.value = ''; }
        function clearVault() { if(confirm("Purge Vault?")) { state.history = []; localStorage.removeItem("a_history"); renderHistory(); } }

        document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', (e) => {
            const view = e.target.dataset.view;
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.querySelectorAll('[data-view]').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
        }));

        document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => applyMode(b.dataset.mode)));
        dom.generateBtn.addEventListener('click', runGeneration);
        applyMode(state.activeMode);
    </script>
</body>
</html>
